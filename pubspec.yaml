name: mushroom_identifier
description: "Автоматическое определение видов грибов с помощью искусственного интеллекта."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # Media / images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  # Обработка изображений: сжатие до 224x224 и коррекция EXIF-ориентации
  # (чистый Dart, без нативных зависимостей).
  image: ^4.2.0

  # Navigation
  go_router: ^14.2.7

  # Local storage
  shared_preferences: ^2.3.2

  # Utilities
  intl: ^0.20.3
  path_provider: ^2.1.4
  # Доступ к хранилищу (экспорт в папку «Загрузки»).
  permission_handler: ^11.3.1
  # Отслеживание состояния сети (офлайн-индикатор).
  connectivity_plus: ^6.0.5
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  generate: true
